<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>รายชื่อสมาชิก</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fc;--ink:#0b2545;--muted:#4b5f7a;--card:#fff;--line:#cfe0f3;--accent:#0a84e8;--green:#1f6b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1628;--ink:#eaf2fc;--muted:#9fb4cf;--card:#112340;--line:#22406b;--accent:#4aa8ff;--green:#6fd1a0}}
:root[data-theme="dark"]{--bg:#0a1628;--ink:#eaf2fc;--muted:#9fb4cf;--card:#112340;--line:#22406b;--accent:#4aa8ff;--green:#6fd1a0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
header{max-width:1100px;margin:0 auto;padding:56px 24px 28px}
h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;line-height:1.15;margin:0 0 12px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:52ch}
.bar{height:6px;width:96px;background:var(--accent);border-radius:3px;margin-bottom:20px}
main{max-width:1100px;margin:0 auto;padding:12px 24px 72px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:3/4;background:var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tx{padding:14px 16px 18px;border-top:4px solid var(--green)}
h2{margin:0;font-size:1.1rem;font-weight:600}
.tx p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
footer{max-width:1100px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:.9rem}
</style></head><body>
